<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#f5ebd5" />
    <meta
      name="description"
      content="Рисованная стратегия в реальном времени о колонии в забытом супе."
    />
    <link rel="icon" href="assets/icon-192.png" />
    <link rel="apple-touch-icon" href="assets/icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>Супостат — колония в холодильнике</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="evolution.css" />
    <link rel="stylesheet" href="headquarters.css" />
    <link rel="stylesheet" href="minigames.css" />
    <link rel="stylesheet" href="campaign.css" />
    <link rel="stylesheet" href="portraits.css" />
    <script defer src="portraits.js"></script>
    <script defer src="guides.js"></script>
    <script defer src="icons.js"></script>
    <script defer src="traits.js"></script>
    <script defer src="campaign.js"></script>
    <script defer src="engine.js"></script>
    <script defer src="town.js"></script>
    <script defer src="scene.js"></script>
    <script defer src="evolution.js"></script>
    <script defer src="headquarters.js"></script>
    <script defer src="minigames.js"></script>
    <script defer src="audio.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <header class="mast">
      <div class="mast-inner">
        <div class="brand"><span data-icon="logo"></span>Супостат<span class="brand-dot">.</span></div>
        <div class="tools">
          <button class="bare" id="guide"><span data-icon="book"></span><span>Как играть</span></button
          ><button class="bare music" id="music" aria-pressed="true">Музыка</button
          ><button class="sound" id="sound" aria-label="Отключить звук" title="Звук"></button>
        </div>
      </div>
    </header>
    <div class="mobile-hud" aria-label="Ресурсы и время">
      <span id="mobile-values"></span><button id="mobile-speed">1×</button
      ><button id="mobile-run">Старт</button>
    </div>
    <main>
      <div class="heading">
        <div>
          <div class="chapter"><i></i><span id="chapter"></span></div>
          <h1 id="scene-title">Забытый суп</h1>
        </div>
        <button id="map-top" class="map-link"><span data-icon="map"></span>Карта захвата</button>
      </div>
      <section class="campaign-strip">
        <div>
          <small id="chapter-num"></small>
          <h2 id="chapter-name"></h2>
          <p id="campaign-status"></p>
        </div>
        <nav class="campaign-nav" aria-label="Управление городом">
          <button data-screen="routes"><span data-icon="map"></span>Экспедиции</button
          ><button data-screen="works"><span data-icon="rim"></span>Стройки</button
          ><button data-screen="evolution"><span data-icon="divide"></span>Эволюция</button
          ><button data-screen="story"><span data-icon="book"></span>Дневник</button>
        </nav>
      </section>
      <div class="board">
        <section class="world" aria-label="Холодильник">
          <div id="scene" class="scene">
            <img
              class="pantry"
              src="assets/fridge.webp"
              alt="Красная эмалированная кастрюля, банка огурцов и сыр на полке холодильника."
            />
            <canvas id="life" width="900" height="600" aria-hidden="true"></canvas>
            <div class="ambient" aria-hidden="true"><i></i><i></i><i></i><b></b><b></b></div>
            <div class="shade"></div>
            <div class="scene-top">
              <span class="day-chip"><span data-icon="calendar"></span><b id="day"></b></span
              ><span class="phase-chip" id="phase-chip"></span>
            </div>
            <button id="visit" class="visit" hidden>Рассмотреть город</button>
            <div class="snapshot-caption">
              <span class="pulse"></span><span id="territory-caption"></span>
            </div>
          </div>
          <aside class="crew-desk" aria-label="Жители холодильника">
            <div id="crew-quote"></div>
            <div class="crew-tools">
              <label>Спросить <select id="crew-picker" aria-label="Кого спросить"><option value="">По ситуации</option><option value="lada">Ладу</option><option value="mira">Миру</option><option value="tim">Тима</option></select></label>
              <button id="crew-follow" type="button"></button>
            </div>
          </aside>
          <div class="scene-note">
            <span class="note-icon" data-icon="eye"></span>
            <div><b id="watch-label"></b><span id="watch-note"></span></div>
            <div class="phase-dots" id="phase-dots"></div>
          </div>
          <div class="event-banner" id="event-banner" aria-label="Случайное событие">
            <span class="event-mark" id="event-mark" aria-hidden="true"></span>
            <span class="event-copy"
              ><b id="event-name">Случайные события</b><span id="event-detail">Пока тихо</span></span
            >
            <span class="event-timer" id="event-timer"></span>
          </div>
        </section>
        <section class="console" aria-label="Управление колонией">
          <div class="console-head">
            <h2>Моя колония</h2>
            <span class="pop" id="pop"></span>
          </div>
          <div class="resources">
            <div class="stat energy">
              <div data-icon="bolt"></div>
              <span>Энергия<strong id="energy"></strong></span>
            </div>
            <div class="stat food">
              <div data-icon="carrot"></div>
              <span>Органика<strong id="food"></strong></span>
            </div>
            <div class="stat dna">
              <div data-icon="divide"></div>
              <span>Эволюция<strong id="dna"></strong></span>
            </div>
            <div class="stat">
              <div data-icon="map"></div>
              <span>Чертежи<strong id="plans"></strong></span>
            </div>
          </div>
          <div class="economy-note" id="economy"></div>
          <div class="time-controls" aria-label="Управление временем">
            <button id="run-toggle" class="primary" aria-pressed="false">Начать</button>
            <div class="speed-controls" role="group" aria-label="Скорость игры">
              <button data-speed="1" aria-pressed="true">1×</button>
              <button data-speed="2" aria-pressed="false">2×</button>
              <button data-speed="4" aria-pressed="false">4×</button>
            </div>
          </div>
          <div class="suspicion">
            <div class="meter-head">
              <span><i data-icon="eye"></i>Обнаружение</span><b id="risk"></b>
            </div>
            <div
              class="track"
              id="risk-track"
              role="progressbar"
              aria-label="Обнаружение"
              aria-valuemin="0"
              aria-valuemax="100"
            >
              <i id="risk-fill"></i>
            </div>
            <p id="visibility" class="visibility"></p>
          </div>
          <div class="budget">
            <label for="reserve">Запас перед делением</label
            ><select id="reserve">
              <option value="0">0 энергии</option>
              <option value="12">12 энергии</option>
              <option value="24">24 энергии</option>
            </select>
          </div>
          <h3 class="mode-heading">Питание колонии</h3>
          <div id="commands"></div>
        </section>
        <section class="route">
          <div class="route-head">
            <h2>Захват холодильника</h2>
            <span id="stage-num"></span>
          </div>
          <div class="route-line" id="route-line"></div>
          <div class="next" id="next"></div>
        </section>
      </div>

      <div class="logline">
        <span data-icon="pencil"></span
        ><output id="feedback" aria-live="polite">Дверца открыта. Колония готова к росту.</output
        ><button id="restart">Сначала</button>
      </div>
    </main>
    <dialog id="dialog" aria-labelledby="dialog-title">
      <div class="dialog-head">
        <h2 id="dialog-title"></h2>
        <button id="close" class="close" aria-label="Закрыть">×</button>
      </div>
      <div id="dialog-body"></div>
    </dialog>
    <noscript>Для игры требуется JavaScript.</noscript>
  </body>
</html>
